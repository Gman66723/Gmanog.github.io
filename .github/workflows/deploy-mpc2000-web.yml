name: Deploy MPC 2000 Web

on:
  push:
    branches: [master]
    paths:
      - "mpc2000-web/**"
      - ".github/workflows/deploy-mpc2000-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload sampler site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mpc2000-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
